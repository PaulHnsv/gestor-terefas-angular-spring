<div class="login-shell">

  <div class="login-brand">
    <div class="login-logo">✓</div>
    <span class="login-app-name">Gestor de Tarefas</span>
  </div>

  <div class="login-card">
    <div class="login-card-header">
      <h2 class="login-title">Bem-vindo de volta</h2>
      <p class="login-subtitle">Acesse sua conta para continuar</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <div class="form-group">
        <label for="username">Usuário</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Digite seu usuário"
          autocomplete="username"
        />
        <div class="field-error" *ngIf="f.username.touched && f.username.invalid">
          <span *ngIf="f.username.errors?.['required']">Usuário é obrigatório.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input
          id="password"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button type="button" class="btn-toggle-password" (click)="togglePassword()">
          {{ showPassword ? 'Ocultar' : 'Mostrar' }}
        </button>
        </div>
        <div class="field-error" *ngIf="f.password.touched && f.password.invalid">
          <span *ngIf="f.password.errors?.['required']">Senha é obrigatória.</span>
          <span *ngIf="f.password.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-btn">
        Entrar
      </button>

      <a routerLink="/register" class="login-link">Não tem conta? Cadastre-se</a>

    </form>
  </div>

</div>
