<div class="login-shell">
  <div class="login-brand">
    <div class="login-logo">✓</div>
    <span class="login-app-name">Gestor de Tarefas</span>
  </div>

  <div class="login-card">
    <div class="login-card-header">
      <h2 class="login-title">Crie sua conta</h2>
      <p class="login-subtitle">Preencha os campos abaixo para criar sua conta</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="username">Usuário</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          placeholder="Digite seu usuário"
          autocomplete="username"
        />
        <div class="field-error" *ngIf="f.username.touched && f.username.invalid">
          <span *ngIf="f.username.errors?.['required']">Usuário é obrigatório.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="input-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button type="button" class="btn-toggle-password" (click)="togglePassword()">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <div class="field-error" *ngIf="f.password.touched && f.password.invalid">
          <span *ngIf="f.password.errors?.['required']">Senha é obrigatória.</span>
          <span *ngIf="f.password.errors?.['minlength']">Senha deve ter no mínimo 6 caracteres.</span>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirme a senha</label>
        <div class="input-wrapper">
          <input
            id="confirmPassword"
            [type]="showConfirmPassword ? 'text' : 'password'"
            formControlName="confirmPassword"
            placeholder="••••••••"
            autocomplete="new-password"
          />
          <button type="button" class="btn-toggle-password" (click)="toggleConfirmPassword()">
            {{ showConfirmPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        <div class="field-error" *ngIf="f.confirmPassword.touched && f.confirmPassword.invalid">
          <span *ngIf="f.confirmPassword.errors?.['required']">Confirmação de senha é obrigatória. <br> </span>
          <span *ngIf="f.confirmPassword.errors?.['mismatch']">As senhas não coincidem.</span>
        </div>
      </div>

      <button type="submit" class="btn btn-primary login-btn">Criar conta</button>
      <a routerLink="/login" class="login-link">Já tem conta? Faça login</a>
    </form>
  </div>
</div>
