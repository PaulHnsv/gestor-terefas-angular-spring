<div class="modal-backdrop fade show"></div>

<div class="modal fade show d-block" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Excluir Projeto</h5>
        <button type="button" class="btn-close" [disabled]="isLoading" (click)="close.emit()"></button>
      </div>

      <div class="modal-body">
        <div class="delete-body">
          <div class="delete-icon">🗑️</div>
          <div>
            <p>
              <strong>Tem certeza?</strong>
              Esta ação é irreversível. O projeto será removido permanentemente.
            </p>
            <p *ngIf="projectName" class="text-muted fst-italic mb-0">
              "{{ projectName }}"
            </p>
          </div>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger mt-3 mb-0" role="alert">
          {{ errorMessage }}
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" [disabled]="isLoading" (click)="close.emit()">Cancelar</button>
        <button type="button" class="btn btn-danger" [disabled]="isLoading" (click)="deleteProjectById()">
          <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-1" role="status"></span>
          Excluir
        </button>
      </div>
    </div>
  </div>
</div>
